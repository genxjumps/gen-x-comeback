name: Temporary Precision Nutrition migration

on:
  push:
    branches:
      - agent/precision-nutrition-residue-2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Apply Nutrition migration
        run: python scripts/temp-nutrition-residue.py
      - name: Format Nutrition checkpoint
        run: bunx prettier --write CURRENT_STATE.md src/routes/nutrition.tsx src/lib/__tests__/app-review.test.ts
      - name: Regenerate release manifest
        run: bun run release:manifest
      - name: Run complete quality gate
        run: bun run verify
      - name: Commit verified Nutrition checkpoint and remove helpers
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-precision-nutrition-run.yml scripts/temp-nutrition-residue.py
          git add CURRENT_STATE.md release-source-manifest.json src/routes/nutrition.tsx src/lib/__tests__/app-review.test.ts
          git commit -m "Migrate Nutrition to Precision Utility"
          git push origin HEAD:agent/precision-nutrition-residue-2
