name: Temporary Precision shared surfaces verification

on:
  push:
    branches:
      - agent/precision-shared-surfaces

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Format shared surfaces
        run: bunx prettier --write CURRENT_STATE.md src/components/account-purchases.tsx src/components/plan-access.tsx src/components/platform-access-boundary.tsx src/components/precision-surfaces.tsx src/components/workout-launch-panel.tsx src/components/workout-media-card.tsx src/design-system/precision/app-migration.css src/routes/my-programs.tsx
      - name: Regenerate release manifest
        run: bun run release:manifest
      - name: Run complete quality gate
        run: bun run verify
      - name: Commit verified formatting and manifest, then remove helper
        run: |
          rm .github/workflows/temp-precision-surfaces-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CURRENT_STATE.md release-source-manifest.json src/components/account-purchases.tsx src/components/plan-access.tsx src/components/platform-access-boundary.tsx src/components/precision-surfaces.tsx src/components/workout-launch-panel.tsx src/components/workout-media-card.tsx src/design-system/precision/app-migration.css src/routes/my-programs.tsx .github/workflows/temp-precision-surfaces-verify.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Verify Precision Utility shared surfaces"
          git push
