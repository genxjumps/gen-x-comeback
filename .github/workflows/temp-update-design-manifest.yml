name: Temporary design manifest update

on:
  push:
    branches:
      - agent/design-foundation-v2

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/design-foundation-v2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run release:manifest
      - name: Commit generated manifest and remove temporary workflow
        run: |
          rm .github/workflows/temp-update-design-manifest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-source-manifest.json .github/workflows/temp-update-design-manifest.yml
          git commit -m "Regenerate release source manifest after formatting"
          git push origin HEAD:agent/design-foundation-v2
