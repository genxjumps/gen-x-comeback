name: Temporary core review scenario reconciliation

on:
  push:
    branches:
      - agent/reconcile-review-scenarios

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Apply core review scenario reconciliation
        run: python .github/temp-review-scenarios.py
      - name: Format review scenario checkpoint
        run: >-
          bunx prettier --write CURRENT_STATE.md
          src/components/app-review-screen.tsx
          src/lib/__tests__/app-review.test.ts
      - name: Remove temporary helpers before manifest generation
        run: git rm .github/temp-review-scenarios.py .github/workflows/temp-review-scenarios.yml
      - name: Regenerate final release manifest
        run: bun run release:manifest
      - name: Run complete quality gate
        run: bun run verify
      - name: Commit verified review scenario checkpoint
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile core review scenarios with production patterns"
          git push origin HEAD:agent/reconcile-review-scenarios
