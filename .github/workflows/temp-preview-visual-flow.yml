name: Temporary preview visual flow verification

on:
  push:
    branches:
      - agent/preview-new-user-visual-flow

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Format preview visual flow
        run: >-
          bunx prettier --write CURRENT_STATE.md
          src/lib/visual-review.ts
          src/routes/index.tsx
          src/routes/start.7-day.tsx
          src/lib/use-new-plan-intake-access.ts
          src/routes/welcome.tsx
          src/routes/assessment.complete.tsx
          src/routes/plan-ready.tsx
          src/lib/__tests__/prelaunch-intake-gate.test.ts
      - name: Remove temporary workflow before manifest generation
        run: git rm .github/workflows/temp-preview-visual-flow.yml
      - name: Regenerate final release manifest
        run: bun run release:manifest
      - name: Run complete quality gate
        run: bun run verify
      - name: Commit verified preview visual flow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add preview-only new-user visual QA flow"
          git push origin HEAD:agent/preview-new-user-visual-flow
