name: Temporary Precision Utility verification

on:
  push:
    branches:
      - agent/design-system-reset

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Format Precision Utility TSX
        run: bunx prettier --write src/design-system/precision/components.tsx src/design-system/precision/showcase.tsx
      - name: Refresh manifest before Vite starts
        run: bun run release:manifest
      - name: Generate route metadata
        run: |
          bun run dev -- --host 127.0.0.1 > /tmp/gxj-vite.log 2>&1 &
          echo $! > /tmp/gxj-vite.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:8080/design-system >/dev/null; then
              kill "$(cat /tmp/gxj-vite.pid)" || true
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gxj-vite.log
          exit 1
      - name: Refresh manifest after generated route metadata
        run: bun run release:manifest
      - name: Run complete quality gate
        run: bun run verify
      - name: Commit verified generated and formatting changes and remove helper
        run: |
          rm .github/workflows/temp-precision-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-source-manifest.json src/routeTree.gen.ts src/design-system/precision/components.tsx src/design-system/precision/showcase.tsx .github/workflows/temp-precision-verify.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Verify Precision Utility production layer"
          git push
