name: Temporary design review screenshots

on:
  push:
    branches:
      - agent/design-foundation-v2

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Start review server
        run: |
          bun run dev -- --host 127.0.0.1 > /tmp/gxj-vite.log 2>&1 &
          echo $! > /tmp/gxj-vite.pid
          for i in {1..40}; do
            if curl --fail --silent http://127.0.0.1:5173/review >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gxj-vite.log
          exit 1
      - name: Capture representative screens
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          mkdir -p design-review
          for slug in home-seven-day account-signed-in programs-active progress-active assessment-step-1 nutrition-setup; do
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot="design-review/${slug}-mobile.png" "http://127.0.0.1:5173/review/${slug}"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --screenshot="design-review/${slug}-desktop.png" "http://127.0.0.1:5173/review/${slug}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: design-review-pr-277
          path: design-review/*.png
          if-no-files-found: error
