name: Temporary Precision primitive migration verification

on:
  push:
    branches:
      - agent/precision-primitive-migration

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Format migrated shared layer
        run: >-
          bunx prettier --write
          CURRENT_STATE.md
          docs/DESIGN_SYSTEM.md
          src/components/platform-page.tsx
          src/components/platform-shell.tsx
          src/components/setup-progress.tsx
          src/components/ui/button.tsx
          src/components/ui/card.tsx
          src/components/ui/checkbox.tsx
          src/components/ui/input.tsx
          src/components/ui/label.tsx
          src/components/ui/radio-group.tsx
          src/components/ui/select.tsx
          src/design-system/precision/app-migration.css
          src/design-system/precision/tokens.css
          src/routes/__root.tsx
      - name: Regenerate release manifest
        run: bun run release:manifest
      - name: Run complete quality gate
        run: bun run verify
      - name: Commit verified formatting and manifest, then remove helper
        run: |
          rm .github/workflows/temp-precision-primitive-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CURRENT_STATE.md docs/DESIGN_SYSTEM.md release-source-manifest.json src/components src/design-system/precision src/routes/__root.tsx .github/workflows/temp-precision-primitive-verify.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Verify Precision Utility primitive migration"
          git push
