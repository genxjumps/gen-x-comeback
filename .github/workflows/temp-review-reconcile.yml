name: Temporary review catalog reconciliation

on:
  push:
    branches:
      - agent/reconcile-review-catalog

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - name: Apply review reconciliation
        run: python .github/temp-review-reconcile.py
      - name: Format review checkpoint
        run: >-
          bunx prettier --write CURRENT_STATE.md
          src/components/platform-shell-styles.ts
          src/components/platform-shell.tsx
          src/components/review-shell.tsx
          src/components/app-review-screen.tsx
          src/design-system/precision/components.tsx
          src/routes/review.tsx
          src/lib/accelerator/__tests__/platform-shell-contract.test.ts
          src/lib/__tests__/review-system-contract.test.ts
      - name: Remove temporary helpers before manifest generation
        run: git rm .github/temp-review-reconcile.py .github/workflows/temp-review-reconcile.yml
      - name: Regenerate final release manifest
        run: bun run release:manifest
      - name: Run complete quality gate
        run: bun run verify
      - name: Commit verified review checkpoint
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reconcile review catalog with production primitives"
          git push origin HEAD:agent/reconcile-review-catalog
